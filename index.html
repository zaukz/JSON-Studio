<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080a0d" />
    <meta
      name="description"
      content="JSON Studio is a focused, local-first workspace for JSON. Format, validate, explore, compare and convert documents without your data ever leaving the browser."
    />
    <title>JSON Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JSON Studio" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('jsonstudio.prefs.v1')
          var prefs = raw ? JSON.parse(raw) : null
          if (prefs && prefs.theme === 'light') {
            document.documentElement.classList.add('light')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#f4f5f7')
          }
        } catch (error) {
          /* preferences are optional */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
